name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # The user's own machines (GitHub-hosted minutes are not available).
    runs-on: [self-hosted, lego-games]
    steps:
      - uses: actions/checkout@v7
        with:
          # stale-todos dates TODOs with git blame, which needs the whole history.
          fetch-depth: 0
      # Node first: pnpm's installer runs on the runner's own node, which is too old in the NAS container.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - name: Gate
        run: pnpm run ci
      - name: Secret scan
        # The whole history, exactly like the pre-push hook.
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          platform="$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/x64/; s/aarch64/arm64/')"
          curl -sSfL "$release/gitleaks_${GITLEAKS_VERSION}_${platform}.tar.gz" | tar -xz -C "$RUNNER_TEMP" gitleaks
          PATH="$RUNNER_TEMP:$PATH" gitleaks detect --source . --redact --no-banner --exit-code 1
