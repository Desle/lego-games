name: dependency-update

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Needs Settings → Actions → "Allow GitHub Actions to create and approve pull requests".
permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    # The user's own machines (GitHub-hosted minutes are not available).
    runs-on: [self-hosted, lego-games]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Node first: pnpm's installer runs on the runner's own node, which is too old in the NAS container.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6
      - name: Update dependencies within their ranges
        run: |
          pnpm install --frozen-lockfile
          pnpm update -r
          pnpm install
      - name: Open or refresh the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Everything is already up to date."
            exit 0
          fi
          if pnpm run ci > "$RUNNER_TEMP/gate.log" 2>&1; then
            result="✅ \`pnpm run ci\` passed on this update."
          else
            result="❌ \`pnpm run ci\` failed on this update — fix before merging."
          fi
          branch="dependency-update/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "chore: weekly dependency update"
          git push --force origin "$branch"
          body="$(printf '%s\n\nPull requests opened by GitHub Actions do not trigger CI on their own, so the gate ran here before opening this one.\n\n<details><summary>Gate output (last 80 lines)</summary>\n\n```\n%s\n```\n</details>\n' "$result" "$(tail -n 80 "$RUNNER_TEMP/gate.log")")"
          if gh pr view "$branch" > /dev/null 2>&1; then
            gh pr edit "$branch" --body "$body"
          else
            gh pr create --head "$branch" --title "Weekly dependency update" --body "$body"
          fi
