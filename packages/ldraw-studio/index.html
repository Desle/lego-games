<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LDraw studio</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #2b3340;
        color: #e8ecf2;
        font:
          14px system-ui,
          sans-serif;
        overflow: hidden;
      }
      #studio {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .tabs {
        display: flex;
        gap: 2px;
        padding: 6px 8px 0;
        background: #141921;
      }
      .tab {
        font: inherit;
        padding: 6px 14px;
        border: 0;
        border-radius: 6px 6px 0 0;
        background: #222934;
        color: inherit;
      }
      .tab[aria-selected='true'] {
        background: #2b3340;
      }
      .panel {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      .stage {
        position: absolute;
        inset: 0;
      }
      .bar {
        position: absolute;
        top: 8px;
        left: 8px;
        right: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .bar select {
        font: inherit;
        padding: 6px;
        max-width: 100%;
      }
      .status {
        position: absolute;
        left: 0;
        bottom: 0;
        max-width: min(520px, 100%);
        max-height: 35%;
        overflow: auto;
        box-sizing: border-box;
        margin: 0;
        padding: 8px;
        background: rgba(20, 25, 33, 0.85);
        white-space: pre-wrap;
        font:
          12px ui-monospace,
          monospace;
      }
    </style>
  </head>
  <body>
    <div id="studio"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
