<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LDraw car builder</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #2b3340;
        color: #e8ecf2;
        font:
          13px system-ui,
          sans-serif;
        overflow: hidden;
      }
      button,
      select,
      input {
        font: inherit;
        color: inherit;
        background: #3a4456;
        border: 1px solid #56627a;
        border-radius: 4px;
        padding: 4px 8px;
      }
      button:hover {
        background: #4a566c;
      }
      button:disabled {
        opacity: 0.5;
      }
      #page {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr) 300px;
        grid-template-rows: auto minmax(0, 1fr) auto;
        height: 100%;
      }
      #bar,
      #viewport,
      #status {
        grid-column: 2;
      }
      #queue {
        grid-column: 1;
        grid-row: 1 / 4;
        overflow: auto;
        background: #1d232e;
        padding: 8px;
      }
      #queue .progress {
        font-weight: 600;
        font-size: 15px;
        margin-bottom: 8px;
      }
      #queue ol {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      #queue .item {
        width: 100%;
        text-align: left;
        background: none;
        border-color: transparent;
        margin-bottom: 2px;
      }
      #queue .item.done {
        color: #7fd88f;
      }
      #queue .current .item {
        border-color: #ffd400;
        background: #3a4456;
      }
      #bar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        padding: 6px 8px;
        background: #1d232e;
      }
      #bar .title {
        margin-right: 8px;
      }
      #bar .done {
        margin-left: auto;
        background: #2f7d43;
        border-color: #49a862;
        font-weight: 600;
        padding: 4px 16px;
      }
      #viewport {
        position: relative;
        min-height: 0;
      }
      #stage {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #help {
        position: absolute;
        left: 8px;
        bottom: 8px;
        background: rgba(20, 25, 33, 0.8);
        padding: 6px 8px;
        border-radius: 4px;
        font-size: 11px;
        pointer-events: none;
      }
      #help dl {
        display: grid;
        grid-template-columns: auto auto;
        gap: 1px 10px;
        margin: 0;
      }
      #help dt {
        font-weight: 600;
        color: #ffd400;
      }
      #help dd {
        margin: 0;
      }
      #status {
        padding: 4px 8px;
        background: #1d232e;
        font:
          12px ui-monospace,
          monospace;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #palette {
        grid-column: 3;
        grid-row: 1 / 4;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px;
        background: #1d232e;
        min-height: 0;
      }
      #palette .tool {
        font-weight: 600;
      }
      #palette .part-list {
        flex: 1;
        overflow: auto;
        min-height: 0;
      }
      #palette .group {
        margin: 8px 0 2px;
        color: #9aa6ba;
        text-transform: uppercase;
        font-size: 11px;
      }
      #palette .part {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border-color: transparent;
        padding: 2px 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #palette .color-grid {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 3px;
      }
      #palette .swatch {
        aspect-ratio: 1;
        padding: 0;
        border: 2px solid transparent;
      }
      #palette .swatch.chosen {
        border-color: #ffd400;
      }
    </style>
  </head>
  <body>
    <div id="page">
      <nav id="queue"></nav>
      <div id="bar"></div>
      <div id="viewport">
        <canvas id="stage"></canvas>
        <div id="help"></div>
      </div>
      <div id="status"></div>
      <aside id="palette"></aside>
    </div>
    <script
      type="module"
      src="/src/modules/remastered/services/ldraw-builder/ldraw-builder-page.ts"
    ></script>
  </body>
</html>
